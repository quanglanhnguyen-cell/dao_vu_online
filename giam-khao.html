<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đạo Vũ · Cổng giám khảo</title><style>body{font:15px Arial,sans-serif;background:#f3f6f4;color:#18352a;margin:0}.wrap{max-width:1050px;margin:28px auto;padding:16px}.card{background:white;border:1px solid #dce7df;border-radius:14px;padding:20px;margin:14px 0}h1,h2{color:#17633b}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #cbd8cf;border-radius:8px;box-sizing:border-box}input{width:100%;margin:7px 0 12px}button{background:#17633b;color:white;border:0;cursor:pointer;font-weight:bold}.muted{color:#66756b}.msg{padding:10px;background:#edf7ef;border-radius:8px;white-space:pre-wrap;margin:10px 0}.hidden{display:none}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid #e5ece7;text-align:left}td input{width:72px;margin:0}td input.note{width:150px}.tablewrap{overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}</style></head><body><main class="wrap"><div class="top"><div><h1>ĐẠO VŨ · BẢNG ĐIỂM GIÁM KHẢO</h1><p class="muted">Khu vực dành riêng cho giám khảo được Admin phân công. Đăng nhập bằng số điện thoại và mật khẩu; không cần OTP.</p></div><button id="logout" class="hidden" onclick="logout()">Đăng xuất</button></div><div id="msg" class="msg">Vui lòng đăng nhập.</div><section id="login" class="card"><h2>Đăng nhập giám khảo</h2><label>Số điện thoại<input id="phone" inputmode="tel" autocomplete="username"></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password"></label><button onclick="login()">Đăng nhập</button></section><section id="portal" class="hidden"><div class="card"><h2>Đợt thi được phân công</h2><select id="assignment" onchange="loadRoster()"></select></div><div class="card"><h2 id="examName">Danh sách võ sinh</h2><div id="roster" class="tablewrap"></div><button style="margin-top:14px" onclick="saveScores()">Lưu điểm đã chấm</button></div></section></main><script>
const URL='https://jndvtnpxepuwqutkkzin.supabase.co',KEY='sb_publishable_rmBZOP_LspTasvW1t7LQhQ_seppbkWW';let session=null,assignments=[];
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;
function normalizePhone(v){let p=String(v||'').replace(/[^0-9+]/g,'');if(p.startsWith('0'))p='+84'+p.slice(1);else if(p.startsWith('84'))p='+'+p;return p}
async function login(){try{say('Đang xác thực…');const phone=normalizePhone($('phone').value);const digits=phone.replace(/\D/g,'');const email='judge.'+digits+'@accounts.daovu.vn';const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Sai số điện thoại hoặc mật khẩu');session=d;await loadAssignments();$('login').classList.add('hidden');$('portal').classList.remove('hidden');$('logout').classList.remove('hidden');say('Đăng nhập thành công.')}catch(e){say('Không đăng nhập được: '+e.message)}}
async function rpc(name,body={}){const r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.details||d?.hint||String(d));return d}
async function loadAssignments(){assignments=await rpc('judge_my_assignments');$('assignment').innerHTML=assignments.map(a=>`<option value="${a.id}">${esc(a.exam_title)} · ${esc(a.exam_date||'')}</option>`).join('')||'<option value="">Chưa được phân công đợt thi</option>';if(assignments.length)await loadRoster();else $('roster').textContent='Admin chưa phân công đợt thi cho tài khoản này.'}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadRoster(){const a=assignments.find(x=>x.id===$('assignment').value);if(!a)return;$('examName').textContent=a.exam_title;let scores=await rpc('judge_get_scores',{p_assignment_id:a.id});const sm=new Map(scores.map(x=>[x.student_id,x]));$('roster').innerHTML='<table><thead><tr><th>STT</th><th>Mã võ sinh</th><th>Họ và tên</th><th>Đai dự thi</th><th>Kata</th><th>Kumite</th><th>Kihon</th><th>Công phá</th><th>Thể lực</th><th>Ghi chú</th></tr></thead><tbody>'+a.roster.map((s,i)=>{const r=sm.get(String(s.student_id))||{};return `<tr data-student="${esc(s.student_id)}"><td>${i+1}</td><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td><td>${esc(s.belt||'')}</td>${['kata','kumite','kihon','breaking','fitness'].map(k=>`<td><input type="number" min="0" max="10" step="0.1" data-score="${k}" value="${r[k]??''}"></td>`).join('')}<td><input class="note" data-score="note" value="${esc(r.note||'')}"></td></tr>`}).join('')+'</tbody></table>'}
async function saveScores(){try{const a=assignments.find(x=>x.id===$('assignment').value);if(!a)throw Error('Chưa chọn đợt thi.');const rows=[...$('roster').querySelectorAll('tr[data-student]')].map(tr=>{const o={student_id:tr.dataset.student};tr.querySelectorAll('[data-score]').forEach(i=>{if(i.value!==''&&i.dataset.score!=='note'){const n=Number(i.value);if(!Number.isFinite(n)||n<0||n>10)throw Error('Điểm phải từ 0 đến 10.');o[i.dataset.score]=String(n)}else o[i.dataset.score]=i.value});return o});const n=await rpc('judge_save_scores',{p_assignment_id:a.id,p_rows:rows});say('Đã lưu điểm cho '+n+' võ sinh.');}catch(e){say('Không lưu được: '+e.message)}}
function logout(){session=null;$('portal').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');say('Đã đăng xuất.')}
</script></body></html>
